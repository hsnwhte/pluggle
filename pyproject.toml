[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pluggle"
version = "0.9.0"
description = "Generic, plugin-based ETL & data sync engine."
requires-python = ">=3.14"
readme = "README.md"

dependencies = [
    "pydantic>=2.13",
    "sqlalchemy>=2.0",
    "typer>=0.27.1",
    "python-dotenv>=1.2.2",
    "httpx>=0.27",
    "psycopg2-binary>=2.9",
    "lxml>=5.0",
    "xmltodict>0.15",
    "python-docx>=1.2",
    "openpyxl>=3.1",
    "pypdf>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff>=0.8"]

[project.scripts]
pluggle = "pluggle.interfaces.cli.main:app"


[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]  # pycodestyle, pyflakes, warnings, import sorting
ignore = ["B008", "E501"] # Typer's Option()/Argument() as default values is intentional